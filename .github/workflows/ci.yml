name: Testes e publicação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Testes de regras
        run: npm test
      - name: Testes no navegador
        run: npm run test:e2e

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}
      - name: Conferir APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|application-label:"
          unzip -l "$APK" | grep -E "assets/www/(index.html|logic.js)"
          cp "$APK" azulejo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: azulejo-apk
          path: azulejo.apk
      - name: Publicar APK para download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" azulejo.apk \
            --target "${{ github.sha }}" \
            --title "Azulejo $TAG (Android, teste)" \
            --notes "APK de teste do Azulejo. No celular Android, baixe azulejo.apk e abra o arquivo para instalar. Pode ser preciso permitir \"instalar apps desconhecidos\" para o navegador. Cada versão nova instala por cima da anterior, mantendo a partida salva." \
            --latest

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Montar site
        run: mkdir _site && cp -r index.html logic.js sw.js manifest.webmanifest icons fonts _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
